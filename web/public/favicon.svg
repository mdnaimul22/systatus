<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Server/Shield Hexagon Background -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>
  <rect x="6" y="6" width="52" height="52" rx="12" fill="none" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.3"/>

  <!-- System Daemon Circuit Grid -->
  <circle cx="16" cy="18" r="1.5" fill="#334155"/>
  <circle cx="48" cy="18" r="1.5" fill="#334155"/>
  <circle cx="16" cy="46" r="1.5" fill="#334155"/>
  <circle cx="48" cy="46" r="1.5" fill="#334155"/>
  <path d="M16 18h8M40 18h8M16 46h8M40 46h8" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Live Pulse Telemetry 'S' Waveform -->
  <path d="M15 32h7l4-10 6 20 5-13 4 5 2-2h6" 
        stroke="url(#pulseGrad)" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Glowing Active Status Dot -->
  <circle cx="49" cy="32" r="3" fill="#34d399" filter="url(#glow)"/>
  <circle cx="49" cy="32" r="1.5" fill="#ffffff"/>
</svg>
